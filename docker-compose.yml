services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airintel
      POSTGRES_USER: airintel
      POSTGRES_PASSWORD: airintel
    ports:
      - "5432:5432"
    volumes:
      - airintel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airintel -d airintel"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://airintel:airintel@db:5432/airintel
      CORS_ORIGINS: http://localhost:5173
      SCRAPER_TARGET_URL: ""
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  airintel_pgdata:
